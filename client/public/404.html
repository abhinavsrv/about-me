<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = window.location.pathname.indexOf("/about-me/") === 0 ? "/about-me/" : "/";
        var route = window.location.pathname.slice(base.length) || "/";
        var parameters = new URLSearchParams(window.location.search);
        parameters.delete("p");
        var remainingQuery = parameters.toString();
        var target = base + "?p=" + encodeURIComponent("/" + route.replace(/^\/+/, "")) + (remainingQuery ? "&" + remainingQuery : "") + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
