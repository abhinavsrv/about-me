<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = new URL("./", window.location.href).pathname;
        var route = window.location.pathname.slice(base.length) || "/";
        var target = base + "?p=" + encodeURIComponent("/" + route.replace(/^\/+/, "")) + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
